name: Interface no Chromium
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar Playwright
        run: npm install --no-save playwright@1.58.2
      - name: Instalar Chromium de testes
        run: npx playwright install --with-deps chromium
      - name: Testar interface e registrar capturas
        run: node browser-tests/ui.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: curva-chromium-screenshots
          path: browser-tests/screenshots
          if-no-files-found: ignore
